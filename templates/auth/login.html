{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="form-box">
      <h3 class="mb-4">Login</h3>
      <form method = "POST" action="{{url_for('auth.login')}}" autocomplete="off">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="text" name = "email" class="form-control" placeholder="abc@gmail.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type = "text" name="password" class = "form-control" placeholder="Enter password" required onfocus="this.type='password'">
        </div>
        <button type="submit" class="btn btn-success w-100">Login</button>
      </form>
      <hr>
      <p class="text-center mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
